name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # A production build touches these at build time (Supabase client
          # construction, static generation for pages that read platform
          # settings, etc.) even though CI never actually calls out to them —
          # dummy values are enough to let the build complete and still catch
          # every real compile-time regression.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_SITE_URL: https://eventbuddy.africa
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          PAYSTACK_SECRET_KEY: placeholder
          RESEND_API_KEY: placeholder
          CRON_SECRET: placeholder
